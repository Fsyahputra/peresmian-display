<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remote Control Peresmian</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #1e293b;
      border-radius: 1rem;
      border: 1px solid #334155;
    }
    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      background: #0f172a;
      padding: 0.4rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid #334155;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.connected {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    /* Main Action Area */
    main {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin: 1.5rem 0;
    }

    /* Giant Play Button */
    .btn-play-container {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pulse-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.4);
      animation: pulse 2.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .btn-play {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7 60%, #0369a1);
      border: 4px solid #7dd3fc;
      box-shadow: 0 15px 35px rgba(2, 132, 199, 0.4), inset 0 2px 10px rgba(255, 255, 255, 0.6);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      z-index: 10;
    }
    .btn-play:active {
      transform: scale(0.94);
      box-shadow: 0 5px 15px rgba(2, 132, 199, 0.6);
    }
    .btn-play svg {
      width: 64px;
      height: 64px;
      fill: currentColor;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .btn-play span {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    /* State info */
    .state-info {
      text-align: center;
    }
    .state-label {
      font-size: 0.9rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
    }
    .state-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    /* Bottom Controls */
    footer {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Reset Button */
    .btn-reset {
      width: 100%;
      padding: 1rem;
      background: #1e293b;
      border: 1px solid #475569;
      color: #cbd5e1;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-reset:active {
      background: #334155;
      transform: scale(0.98);
    }

    /* PIN Modal */
    #pinModal {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.98);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1.5rem;
    }
    #pinModal.hidden {
      display: none;
    }
    .pin-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2rem;
      border-radius: 1.25rem;
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .pin-card h2 {
      font-size: 1.35rem;
      margin-bottom: 0.5rem;
      color: #f1f5f9;
    }
    .pin-card p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .pin-input {
      width: 100%;
      padding: 0.85rem;
      font-size: 1.5rem;
      text-align: center;
      letter-spacing: 6px;
      background: #0f172a;
      border: 2px solid #3b82f6;
      border-radius: 0.75rem;
      color: #fff;
      margin-bottom: 1.25rem;
      outline: none;
    }
    .btn-unlock {
      width: 100%;
      padding: 0.9rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- PIN Protection Modal -->
  <div id="pinModal">
    <div class="pin-card">
      <h2>🔒 Masukkan PIN Remote</h2>
      <p>Akses diamankan untuk mencegah tombol peresmian tidak sengaja terpencet.</p>
      <input type="password" id="inputPin" class="pin-input" placeholder="••••" maxlength="8" pattern="[0-9]*" inputmode="numeric">
      <button class="btn-unlock" id="btnUnlock">MASUK KE REMOTE</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand">
      <span>📱</span>
      <span>REMOTE PERESMIAN</span>
    </div>
    <div class="status-badge">
      <span class="dot" id="wsDot"></span>
      <span id="wsStatus">Connecting</span>
    </div>
  </header>

  <!-- Main Center Action -->
  <main>
    <div class="state-info">
      <div class="state-label">Status Proyektor</div>
      <div class="state-value" id="screenStatus">STANDBY</div>
    </div>

    <div class="btn-play-container">
      <div class="pulse-ring"></div>
      <button class="btn-play" id="btnPlay">
        <svg viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <span>RESMIKAN</span>
      </button>
    </div>
  </main>

  <!-- Footer Controls -->
  <footer>
    <button class="btn-reset" id="btnReset">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span>RESET KE AWAL (STANDBY)</span>
    </button>
  </footer>

  <script>
    let savedPin = localStorage.getItem('remote_pin') || '';
    let ws;

    const pinModal = document.getElementById('pinModal');
    const inputPin = document.getElementById('inputPin');
    const btnUnlock = document.getElementById('btnUnlock');
    const wsDot = document.getElementById('wsDot');
    const wsStatus = document.getElementById('wsStatus');
    const screenStatus = document.getElementById('screenStatus');
    const btnPlay = document.getElementById('btnPlay');
    const btnReset = document.getElementById('btnReset');

    // Cek status PIN awal
    if (savedPin) {
      pinModal.classList.add('hidden');
    }

    btnUnlock.addEventListener('click', () => {
      const pin = inputPin.value.trim();
      if (!pin) return;
      savedPin = pin;
      localStorage.setItem('remote_pin', savedPin);
      pinModal.classList.add('hidden');
    });

    // Setup WebSocket
    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => {
        wsDot.classList.add('connected');
        wsStatus.innerText = 'Connected';
      };

      ws.onclose = () => {
        wsDot.classList.remove('connected');
        wsStatus.innerText = 'Offline';
        setTimeout(connectWS, 2000);
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.type === 'STATE_SYNC') {
            screenStatus.innerText = data.state.status;
            if (data.state.status === 'PLAYING') {
              screenStatus.style.color = '#38bdf8';
            } else if (data.state.status === 'ENDED') {
              screenStatus.style.color = '#22c55e';
            } else {
              screenStatus.style.color = '#e2e8f0';
            }
          } else if (data.type === 'ERROR') {
            alert('Perhatian: ' + data.message);
            if (data.message.includes('PIN')) {
              localStorage.removeItem('remote_pin');
              pinModal.classList.remove('hidden');
            }
          }
        } catch (e) {
          console.error(e);
        }
      };
    }

    // Trigger Play
    btnPlay.addEventListener('click', () => {
      if (!savedPin) {
        pinModal.classList.remove('hidden');
        return;
      }

      if (ws && ws.readyState === WebSocket.OPEN) {
        // Haptic feedback jika didukung tablet
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

        ws.send(JSON.stringify({
          type: 'COMMAND',
          action: 'PLAY',
          pin: savedPin
        }));
      }
    });

    // Trigger Reset
    btnReset.addEventListener('click', () => {
      if (!savedPin) {
        pinModal.classList.remove('hidden');
        return;
      }

      if (confirm('Yakin ingin mereset video display kembali ke awal?')) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'COMMAND',
            action: 'RESET',
            pin: savedPin
          }));
        }
      }
    });

    connectWS();
  </script>
</body>
</html>
